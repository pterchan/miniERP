# 一次性行为测试数据库：与主栈完全隔离，数据放 tmpfs，端口仅绑回环。
#
# 用法：
#   docker compose -f docker-compose.test.yml up -d --wait
#   python3 -m unittest discover -s tests -v
#   docker compose -f docker-compose.test.yml down -v
#
# 未启动该库时，行为测试会整类跳过，静态/纯函数测试不受影响。
# 默认连接串见 tests/support/testdb.py（TEST_DATABASE_URL 可覆盖）。

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: erp_test
      POSTGRES_PASSWORD: erp_test
      POSTGRES_DB: erp_test
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_test -d erp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
