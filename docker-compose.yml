services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventory}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-${BOOTSTRAP_WAREHOUSE_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD or BOOTSTRAP_WAREHOUSE_PASSWORD}}
      BOOTSTRAP_REQUESTER_USERNAME: ${BOOTSTRAP_REQUESTER_USERNAME:-colleague}
      BOOTSTRAP_REQUESTER_PASSWORD: ${BOOTSTRAP_REQUESTER_PASSWORD:?set BOOTSTRAP_REQUESTER_PASSWORD}
      ERP_BOOTSTRAP_STRICT: "1"
      ERP_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      OCR_SERVICE_URL: http://ocr:8010
      OCR_INTERNAL_TOKEN: ${OCR_INTERNAL_TOKEN:?set OCR_INTERNAL_TOKEN}
      OCR_PROXY_TIMEOUT_SECONDS: ${OCR_PROXY_TIMEOUT_SECONDS:-25}
      ERP_COOKIE_PATH: ${ERP_COOKIE_PATH:-/}
      ERP_SECURE_COOKIES: ${ERP_SECURE_COOKIES:-0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-erp-product-images}
      MINIO_SECURE: "0"
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-127.0.0.1:8000}:8000"

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "9000"
    ports:
      - "${MINIO_CONSOLE_PORT:-127.0.0.1:19001}:9001"

  ocr:
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
    environment:
      OCR_INTERNAL_TOKEN: ${OCR_INTERNAL_TOKEN:?set OCR_INTERNAL_TOKEN}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/readyz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g

  web:
    build:
      context: ./web
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-127.0.0.1:18080}:8080"

volumes:
  postgres_data:
  minio_data:
